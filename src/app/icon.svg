<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c28"/>
      <stop offset="70%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#06090e"/>
    </radialGradient>

    <!-- Outer Blue Swoosh Gradient -->
    <linearGradient id="blueSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#00b4d8"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Inner White/Ice Swoosh Gradient -->
    <linearGradient id="whiteSwoosh" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- T Letter Gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0096c7"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Crisp Drop Shadow for Text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Circle (Guarantees visibility on both light and dark browser title bars) -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Glowing Aura -->
  <circle cx="160" cy="256" r="140" fill="#00b4d8" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Dynamic Cyan/Blue Crescent Arc -->
  <path d="M 275 62 C 145 55 52 145 52 268 C 52 385 142 458 265 458 C 318 458 368 440 405 410 C 342 432 270 422 215 390 C 135 344 100 248 135 160 C 160 98 215 68 275 62 Z" 
        fill="url(#blueSwoosh)" 
        filter="url(#glow)"/>

  <!-- Primary Middle Cyan Swoosh Wave -->
  <path d="M 285 88 C 172 88 95 168 95 268 C 95 362 165 425 260 428 C 302 430 350 412 382 390 C 315 408 248 392 200 358 C 138 314 118 226 156 156 C 184 106 232 90 285 88 Z" 
        fill="url(#blueSwoosh)"/>

  <!-- Inner Dynamic Crisp White Crescent Swoosh -->
  <path d="M 230 148 C 165 180 135 245 152 318 C 168 375 220 416 288 424 C 338 430 388 412 420 382 C 352 400 288 388 240 354 C 185 315 170 240 205 178 C 212 166 220 156 230 148 Z" 
        fill="url(#whiteSwoosh)" 
        opacity="0.95"/>

  <!-- Secondary Inner White Accent Curve -->
  <path d="M 205 240 C 195 285 220 338 260 365 C 295 388 342 392 380 380 C 330 388 282 374 250 348 C 218 322 208 278 218 240 C 214 240 209 240 205 240 Z" 
        fill="#ffffff" 
        opacity="0.85"/>

  <!-- Letters MT Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Letter 'M' (Crisp White Geometric Typography) -->
    <path d="M 210 328 L 210 184 L 244 184 L 278 262 L 312 184 L 346 184 L 346 328 L 314 328 L 314 235 L 288 295 L 268 295 L 242 235 L 242 328 Z" 
          fill="#ffffff"/>

    <!-- Letter 'T' (Vibrant Electric Cyan Typography) -->
    <path d="M 358 218 L 358 184 L 468 184 L 468 218 L 429 218 L 429 328 L 397 328 L 397 218 Z" 
          fill="url(#tGrad)"/>
  </g>

  <!-- Specular Highlights / Star Flares -->
  <circle cx="210" cy="184" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="468" cy="184" r="3" fill="#38bdf8" opacity="0.9"/>
  <path d="M 148 180 Q 152 170 162 170 Q 152 170 148 160 Q 144 170 134 170 Q 144 170 148 180 Z" fill="#ffffff" opacity="0.7"/>
</svg>
